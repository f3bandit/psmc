// MC/PS MemCard Pro for Android: the same app as the Windows build (app/main.cpp, SDL2 +
// Dear ImGui) on SDL's Android activity. SDL2's source is found through the SDL2_SRC
// property or environment variable (git clone -b release-2.30.9 https://github.com/libsdl-org/SDL).
plugins { id 'com.android.application' }

def sdlSrc = project.findProperty('SDL2_SRC') ?: System.getenv('SDL2_SRC') ?: "${rootDir}/../../SDL2"

android {
    namespace 'com.f3bandit.mcps'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.f3bandit.mcps'
        minSdk 24
        targetSdk 34
        versionCode 28
        versionName '0.1.28'
        externalNativeBuild {
            cmake {
                arguments "-DSDL2_SRC=${sdlSrc}", '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
            }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideloaded; a real key comes with a store release
        }
    }
    externalNativeBuild {
        cmake { path 'jni/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
